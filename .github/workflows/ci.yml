name: ci

# Repo GitHub = racine de ce projet Nuxt (pas un sous-dossier monorepo).
# Ne pas filtrer sur annuaire-tsa-nuxt/** : le CI ne se lancerait jamais.

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        # version via package.json "packageManager" — ne pas la redéclarer ici
        uses: pnpm/action-setup@v4

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test
