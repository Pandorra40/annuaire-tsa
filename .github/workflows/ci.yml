name: ci

# Conservé pour compatibilité : délègue au workflow racine si le repo est cloné depuis annuaire-tsa-nuxt uniquement.
# Le workflow principal est ../.github/workflows/ci.yml (monorepo TSA).

on:
  push:
    paths:
      - 'annuaire-tsa-nuxt/**'

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test
